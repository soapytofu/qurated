name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --project app --locked
      - run: app/.venv/bin/python -m pytest tests -q
      - run: node --check app/static/app.js
      - run: node --test tests/frontend.test.cjs
